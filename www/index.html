<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1520">
<title>Ahwaz, Compiled · سفر خوزستان</title>
<style>
@font-face{font-family:Vazirmatn;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D}
@font-face{font-family:Vazirmatn;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:Vazirmatn;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-arabic-600-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D}
@font-face{font-family:Vazirmatn;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:Vazirmatn;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200D}
@font-face{font-family:Vazirmatn;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/vazirmatn-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:Silkscreen;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
:root{
  --sand: oklch(93% 0.028 75);
  --sand-2: oklch(87% 0.04 72);
  --sand-3: oklch(79% 0.045 70);
  --ink: oklch(24% 0.03 300);
  --ink-2: oklch(44% 0.03 300);
  --dusk: oklch(57% 0.17 22);
  --gold: oklch(83% 0.14 78);
  --frame: oklch(21% 0.03 300);
  --frame-hi: oklch(30% 0.035 300);
  --panel: oklch(26% 0.035 300);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sand);color:var(--ink)}
body{
  min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:20px;
  padding:24px clamp(12px,4vw,48px) 20px;
  font-family:Vazirmatn,system-ui,sans-serif;font-size:1rem;line-height:1.6;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
h1{font-family:Silkscreen,monospace;font-weight:400;font-size:clamp(1.25rem,2.6vw,1.9rem);letter-spacing:.04em;direction:ltr;line-height:1.1}
h1 span{color:var(--dusk)}
.meta{font-size:.875rem;color:var(--ink-2);max-width:62ch}
main{display:grid;place-items:center;align-content:center;gap:16px}
.stage{
  position:relative;width:min(100%, calc((100dvh - 210px) * 16 / 9), 1280px);aspect-ratio:16/9;
  background:var(--frame);padding:6px;border-radius:6px;container-type:inline-size;
  box-shadow:0 1px 0 var(--frame-hi) inset,0 24px 48px -28px oklch(22% 0.06 300 / .55);
}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:2px;cursor:pointer}
canvas:focus{outline:none}
canvas#game:focus-visible{outline:3px solid var(--dusk);outline-offset:6px}
.keys{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:center;font-size:.875rem;color:var(--ink-2)}
.keys span{white-space:nowrap}
kbd{
  font-family:Silkscreen,monospace;font-size:.75rem;line-height:1;background:var(--sand-2);color:var(--ink);
  border:1px solid var(--sand-3);border-bottom-width:3px;border-radius:4px;padding:4px 8px;
  direction:ltr;display:inline-block;margin-inline:2px;
}
.touch{display:none;width:min(100%,720px);justify-content:space-between;align-items:center;gap:12px;direction:ltr;user-select:none;-webkit-user-select:none;touch-action:none}
.touch .pad{display:flex;gap:12px}
.touch button{
  font-family:Silkscreen,monospace;font-size:1rem;letter-spacing:.06em;color:var(--sand);
  background:var(--frame);border:0;border-radius:10px;min-width:72px;height:64px;padding:0 20px;
  box-shadow:0 4px 0 oklch(14% 0.03 300);transition:transform 120ms var(--ease),box-shadow 120ms var(--ease);
  -webkit-tap-highlight-color:transparent;touch-action:none;
}
.touch button.jump{background:var(--dusk);box-shadow:0 4px 0 oklch(40% 0.14 22);min-width:120px}
.touch button.on{transform:translateY(3px);box-shadow:0 1px 0 oklch(14% 0.03 300)}
.touch button.jump.on{box-shadow:0 1px 0 oklch(40% 0.14 22)}
footer{font-size:.75rem;color:var(--ink-2);text-align:center}

/* ---------- overlay screens ---------- */
.ov{
  position:absolute;inset:6px;display:none;flex-direction:column;justify-content:center;gap:clamp(10px,2.2cqw,24px);
  padding:clamp(14px,3.2cqw,40px) clamp(16px,4.5cqw,56px);background:oklch(18% 0.035 300 / .9);color:var(--sand);
  overflow:auto;border-radius:2px;
}
.ov.on{display:flex;animation:ovIn .45s var(--ease)}
@keyframes ovIn{from{opacity:0;transform:translateY(8px)}}
.ov h2{font-weight:800;font-size:clamp(1.15rem,3.3cqw,2.3rem);line-height:1.25;text-wrap:balance}
.kick{font-family:Silkscreen,monospace;direction:ltr;text-align:right;letter-spacing:.08em;font-size:clamp(.62rem,1.25cqw,.85rem);color:var(--gold)}
.kick em{font-style:normal;color:var(--sand)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.b{
  font-weight:800;background:var(--gold);color:var(--frame);border-radius:8px;padding:.5em 1.3em;min-height:44px;
  box-shadow:0 3px 0 oklch(58% 0.12 68);transition:transform 120ms var(--ease),box-shadow 120ms var(--ease),background .2s;
  font-size:clamp(.85rem,1.7cqw,1.05rem)
}
.b:hover{background:oklch(87% 0.13 82)}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 oklch(58% 0.12 68)}
.b.alt{background:transparent;color:var(--sand);box-shadow:inset 0 0 0 2px oklch(52% 0.03 300)}
.b.alt:hover{background:oklch(28% 0.035 300)}
.lnk{color:oklch(78% 0.03 300);text-decoration:underline;text-underline-offset:4px;font-size:clamp(.78rem,1.4cqw,.92rem);padding:8px 4px;min-height:40px}
.lnk:hover{color:var(--sand)}
.ov :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.chars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.2cqw,14px)}
.ch{background:var(--panel);border-radius:10px;padding:clamp(6px,1.2cqw,14px) 4px clamp(6px,1cqw,12px);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s,transform .15s var(--ease)}
.ch:hover{background:oklch(30% 0.04 300)}
.ch.sel{background:oklch(34% 0.06 300);box-shadow:inset 0 0 0 2px var(--gold)}
.ch canvas{width:min(100%,10cqw);aspect-ratio:24/30;margin-bottom:4px}
.ch b{font-size:clamp(.8rem,1.8cqw,1.1rem);line-height:1.3}
.ch small{font-size:clamp(.62rem,1.25cqw,.82rem);color:oklch(76% 0.03 300);line-height:1.3;text-align:center}
.perk{font-size:clamp(.8rem,1.6cqw,1rem);color:oklch(86% 0.02 300);max-width:70ch;min-height:3.2em}
.perk b{color:var(--sand)}
.tag{display:inline-block;margin-inline-start:6px;background:oklch(34% 0.07 70);color:var(--gold);border-radius:6px;padding:0 8px;font-weight:600}

.who{display:flex;align-items:center;gap:12px}
.who canvas{width:clamp(28px,4.5cqw,48px);aspect-ratio:24/30}
.who b{display:block;font-size:clamp(.9rem,1.8cqw,1.1rem)}
.who small{color:oklch(76% 0.03 300);font-size:clamp(.7rem,1.3cqw,.85rem)}
.who .lnk{margin-inline-start:auto}
.stops{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.1cqw,12px);counter-reset:s}
.stop{position:relative;width:100%;height:100%;text-align:right;background:var(--panel);border-radius:10px;padding:clamp(6px,1.2cqw,14px) clamp(8px,1.4cqw,16px);display:flex;flex-direction:column;gap:0;transition:background .2s}
.stop:hover:not(:disabled){background:oklch(31% 0.045 300)}
.stop .n{font-family:Silkscreen,monospace;color:var(--gold);font-size:clamp(.62rem,1.2cqw,.8rem);direction:ltr;text-align:right}
.stop b{font-size:clamp(.78rem,1.65cqw,1.02rem);line-height:1.35}
.stop small{color:oklch(74% 0.03 300);font-size:clamp(.62rem,1.2cqw,.8rem)}
.stop .rk{position:absolute;left:clamp(6px,1.2cqw,14px);top:clamp(6px,1cqw,12px);font-family:Silkscreen,monospace;font-size:clamp(.8rem,1.9cqw,1.3rem);color:var(--gold)}
.stop.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.stop.lock{opacity:.4;cursor:not-allowed}
.shelf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:clamp(1.1rem,2.6cqw,1.7rem);line-height:1}
.shelf .lbl{font-size:clamp(.72rem,1.3cqw,.88rem);color:oklch(76% 0.03 300);margin-inline-end:6px}
.shelf .empty{width:clamp(18px,2.6cqw,28px);height:clamp(18px,2.6cqw,28px);border-radius:6px;box-shadow:inset 0 0 0 1.5px oklch(40% 0.03 300)}

.dlg{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,3.5cqw,44px);align-items:start}
.por{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.por canvas{width:clamp(64px,13cqw,150px);aspect-ratio:24/30;background:oklch(26% 0.04 300);border-radius:12px;padding:6px}
.por b{margin-top:6px;font-size:clamp(.85rem,1.8cqw,1.1rem)}
.por small{color:var(--gold);font-size:clamp(.66rem,1.3cqw,.85rem)}
.talk{display:flex;flex-direction:column;gap:clamp(6px,1.2cqw,12px)}
.lines{display:flex;flex-direction:column;gap:8px;min-height:5em}
.lines p{background:oklch(95% 0.02 80);color:var(--ink);padding:.55em .95em;border-radius:14px 4px 14px 14px;max-width:60ch;font-size:clamp(.82rem,1.7cqw,1.05rem);animation:ovIn .4s var(--ease)}
.fact{font-size:clamp(.74rem,1.45cqw,.92rem);color:oklch(80% 0.03 300);border-top:1px dashed oklch(40% 0.03 300);padding-top:10px;max-width:80ch}
.fact span{color:var(--gold);font-weight:800}

.res{display:flex;flex-direction:column;gap:clamp(8px,1.6cqw,16px);align-items:flex-start}
.stats{color:oklch(84% 0.02 300);font-size:clamp(.8rem,1.6cqw,1rem)}
.souv{display:inline-flex;align-items:center;gap:12px;background:oklch(32% 0.07 70);border-radius:12px;padding:8px 18px 8px 14px}
.souv span{font-size:clamp(1.5rem,3.6cqw,2.3rem);line-height:1}
.souv small{display:block;color:var(--gold);font-weight:800;font-size:.8rem}
.say{display:flex;align-items:center;gap:12px;max-width:62ch;font-size:clamp(.82rem,1.6cqw,1rem)}
.say canvas{width:clamp(30px,5cqw,52px);aspect-ratio:24/30;flex:none}
.cast{display:flex;flex-wrap:wrap;gap:clamp(8px,1.6cqw,18px)}
.cast div{display:flex;flex-direction:column;align-items:center;width:clamp(48px,8cqw,84px);font-size:clamp(.6rem,1.15cqw,.78rem);text-align:center;color:oklch(80% 0.03 300);line-height:1.35}
.cast canvas{width:clamp(26px,4.6cqw,48px);aspect-ratio:24/30;margin-bottom:4px}

@media (pointer:coarse){.touch{display:flex}.keys{display:none}.stage{width:min(100%, calc((100dvh - 150px) * 16 / 9))}}
@media (pointer:coarse) and (orientation:landscape){body{padding-top:8px;gap:8px}header{display:none}}
@media (max-width:760px){
  .ov{position:fixed;inset:0;z-index:40;border-radius:0;justify-content:flex-start;background:oklch(18% 0.035 300 / .97)}
  .chars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ch canvas{width:56px}
  .stops{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dlg{grid-template-columns:1fr}
  .por{flex-direction:row;gap:12px;text-align:right}
  .por canvas{width:64px}
}
@media (prefers-reduced-motion:reduce){.ov.on,.lines p{animation:none}}
</style>

<body>
<header>
  <h1>AHWAZ, <span>COMPILED</span></h1>
  <p class="meta">هشت مرحله در خوزستان، از کارون تا اروند. همسفرت را از قوم‌های استان انتخاب کن، سوغاتی جمع کن و از چالش‌ها رد شو.</p>
</header>
<main>
  <div class="stage">
    <canvas id="game" width="320" height="180" tabindex="0" aria-label="بازی Ahwaz Compiled"></canvas>
    <div class="ov" id="ov" role="dialog" aria-modal="false" aria-label="منوی بازی"></div>
  </div>
  <div class="keys">
    <span><kbd>←</kbd><kbd>→</kbd> حرکت</span>
    <span><kbd>SPACE</kbd> پرش (نگه داری = پرش بلندتر)</span>
    <span><kbd>R</kbd> شروع دوباره‌ی مرحله</span>
    <span><kbd>ESC</kbd> نقشه</span>
    <span><kbd>M</kbd> صدا</span>
  </div>
  <div class="touch" aria-hidden="true">
    <div class="pad"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <button class="jump" data-k="jump">JUMP</button>
  </div>
</main>
<footer>بدون عکس، بدون فایل صوتی. همه‌ی تصویر و صدا همین لحظه با کد ساخته می‌شود.</footer>

<script>
(() => {
'use strict';
const W = 320, H = 180, WL = 102, RIV = 140, FY = 168, END = 1560, PSX = 110;
const cv = document.getElementById('game');
let ctx = cv.getContext('2d', { willReadFrequently: true });
ctx.imageSmoothingEnabled = false;

// ---------------------------------------------------------------- utils
function rngf(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rngf(1405), rr = (a, b) => a + R() * (b - a), ri = (a, b) => Math.floor(rr(a, b));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const mix = (a, b, t) => { t = clamp(t, 0, 1); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; };
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const css = (c, al) => al == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
const pad2 = n => String(Math.max(0, n | 0)).padStart(2, '0');

// ---------------------------------------------------------------- palette / time of day
const S = {};
const KEYS = [
  [0.00, { top: [62, 126, 204], hor: [252, 210, 150], sun: [255, 244, 200], amb: 1.00 }],
  [0.32, { top: [76, 88, 170], hor: [255, 156, 92], sun: [255, 206, 120], amb: 0.92 }],
  [0.62, { top: [40, 34, 98], hor: [226, 88, 96], sun: [255, 120, 80], amb: 0.72 }],
  [1.00, { top: [12, 12, 40], hor: [96, 44, 92], sun: [220, 80, 70], amb: 0.52 }]];
function setPalette(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, k0] = KEYS[i], [t1, k1] = KEYS[i + 1];
    if (t <= t1 || i === KEYS.length - 2) {
      const u = clamp((t - t0) / (t1 - t0), 0, 1);
      S.top = mix(k0.top, k1.top, u); S.hor = mix(k0.hor, k1.hor, u); S.sun = mix(k0.sun, k1.sun, u);
      S.amb = k0.amb + (k1.amb - k0.amb) * u; break;
    }
  }
  S.dusk = sm((t - 0.28) / 0.42); S.t = t;
}
const lit = (c, h = 0) => mul(mix(c, S.hor, 0.1 + h), S.amb);

// ---------------------------------------------------------------- pixel primitives
function F(c) { ctx.fillStyle = Array.isArray(c) ? css(c) : c; }
function rect(x0, y0, x1, y1, c) {
  F(c); if (x1 < x0) [x0, x1] = [x1, x0]; if (y1 < y0) [y0, y1] = [y1, y0];
  x0 = Math.round(x0); y0 = Math.round(y0); ctx.fillRect(x0, y0, Math.round(x1) - x0 + 1, Math.round(y1) - y0 + 1);
}
function px(x, y, c) { F(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function line(x0, y0, x1, y1, c, w = 1) {
  F(c); x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy; const o = w > 1 ? (w >> 1) : 0;
  for (let n = 0; n < 1200; n++) {
    ctx.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function pline(p, c, w = 1) { for (let i = 1; i < p.length; i++) line(p[i - 1][0], p[i - 1][1], p[i][0], p[i][1], c, w); }
function ell(x0, y0, x1, y1, c) {
  F(c); const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2 || 0.5;
  for (let y = Math.round(cy - ry); y <= Math.round(cy + ry); y++) {
    const v = (y - cy) / ry; if (Math.abs(v) > 1) continue;
    const hw = rx * Math.sqrt(1 - v * v), a = Math.round(cx - hw), b = Math.round(cx + hw);
    ctx.fillRect(a, y, b - a + 1, 1);
  }
}
function ring(x0, y0, x1, y1, c) {
  F(c); const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
  const n = Math.max(12, Math.round((rx + ry) * 3));
  for (let i = 0; i < n; i++) { const a = i / n * 6.2832; ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1); }
}
function poly(p, c) { F(c); ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); ctx.fill(); }
let GQ = [];
function glow(x, y, r, c, a) { GQ.push([x, y, r, c, a]); }
function flushGlow() {
  for (const [x, y, r, c, a] of GQ) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, css(c, a)); g.addColorStop(1, css(c, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  GQ = [];
}

// ---------------------------------------------------------------- 3x5 pixel font
const GL = {
  "A": ".#.#.#####.##.#",
  "B": "##.#.###.#.###.",
  "C": ".###..#..#...##",
  "D": "##.#.##.##.###.",
  "E": "####..##.#..###",
  "F": "####..##.#..#..",
  "G": ".###..#.##.#.##",
  "H": "#.##.#####.##.#",
  "I": "###.#..#..#.###",
  "J": "..#..#..##.#.#.",

const store = () => { try { localStorage.setItem(LS, JSON.stringify(SAVE)); } catch (e) { } };
const CH = () => CHARS.find(c => c.id === SAVE.char) || CHARS[0];
const fa = n => Number(n).toLocaleString('fa-IR');

const K = { left: false, right: false, jump: false, jumpPressed: false };
let LVI = 0, LV, gaps = [], plats = [], enemies = [], items = [], P, cam = 0, f = 0, state = 'title', timeLeft = 0, tod = 0;
let nItems = 0, nBirds = 0, nKills = 0, hurts = 0, parts = [], pops = [], prints = [], ev = {}, finish = 0, introAt = 0, lastStep = 0, shake = 0;
let failWhy = '', pendingOv = null, lastRank = 'C', lastFirst = false, lastUsed = 0;

const groundAt = x => !gaps.some(g => x > g[0] + 1 && x < g[1] - 1);
const gapAt = x => gaps.find(g => x > g[0] - 6 && x < g[1] + 6);
const puddleAt = x => LVI === 0 ? PUDDLES.findIndex(p => Math.abs(x - p.x) <= p.w / 2 - 2) : -1;
const pan = sx => clamp((sx - W / 2) / (W / 2), -0.8, 0.8);

function genItems() {
  const out = [], step = 56; let n = 0;
  for (let x = 150; x < LV.len - 60; x += step, n++) {
    const gp = plats.find(p => p.g && Math.abs(x - p.x) <= p.w / 2 + 4);
    if (gp) { if (!out.some(o => o.x === gp.x)) out.push({ x: gp.x, h: gp.h + 13 }); continue; }
    const g = gapAt(x);
    if (g) { if (g[1] - g[0] <= 48) out.push({ x: (g[0] + g[1]) / 2, h: 30 }); continue; }
    out.push({ x, h: n % 5 === 3 ? 40 : 13 });
  }
  for (const p of plats) if (!p.g) out.push({ x: p.x, h: p.h + 13 });
  return out.map(o => ({ x: o.x, h: o.h, got: false }));
}
function buildLevel(i) {
  LVI = i; LV = LEVELS[i]; M.key = LV.key || 1;
  gaps = LV.gaps || [];
  plats = (LV.plats || []).map(p => ({ x: p[0], w: p[1], h: p[2], st: p[3], mv: p[4] || null, g: !!p[5], cx: p[0], px: p[0], dx: 0 }));
  enemies = (LV.en || []).map(e => Object.assign({ dir: 1, dead: -1, ph: R() * 6.28, y: 0, h: 0, s: 0.4, r: 30, per: 160, off: 0, on: false, warn: false, cyc: 0 }, e, { x0: e.x }));
  items = genItems();
  const ch = CH();
  P = { x: 70, y: 0, vx: 0, vy: 0, ground: true, face: 1, inP: -1, wet: 0, on: null, jumps: 0, inv: 0, safe: 70, hearts: ch.id === 'arab' ? 4 : 3, max: ch.id === 'arab' ? 4 : 3 };
  cam = 0; timeLeft = LV.time + (ch.id === 'dez' ? 20 : 0); tod = LV.tod[0];
  nItems = 0; nBirds = 0; nKills = 0; hurts = 0; parts = []; pops = []; prints = []; shake = 0;
  ev = { bridge: -1, lamps: -1, train: -1, stall: false }; lastStep = Math.floor(P.x / 7); pendingOv = null;
  FLOCKS.forEach(fl => { fl.fs = -1; fl.cooed = 0; }); PUDDLES.forEach(p => p.sf = -999);
}

function splashAt(i, big) {
  const p = PUDDLES[i]; p.sf = f;
  for (let k = 0; k < (big ? 14 : 8); k++) { const a = -Math.PI * (0.1 + 0.8 * k / (big ? 13 : 7)); parts.push({ x: P.x, y: FY, vx: Math.cos(a) * (big ? 0.9 : 0.6), vy: Math.sin(a) * (big ? 1.6 : 1.1), life: 40 }); }
  SFX.splash(big);
}
function dust(n, col) { for (let k = 0; k < n; k++) parts.push({ x: P.x + (R() - 0.5) * 6, y: FY - P.y, vx: (R() - 0.5) * 0.8, vy: -R() * 0.8, life: 22, c: col }); }

function updEnemy(e) {
  if (e.dead >= 0) return;
  if (e.t === 'scorp' || e.t === 'bee' || e.t === 'mosq' || e.t === 'buff') {
    e.x += e.dir * e.s;
    if (e.x > e.x0 + e.r) { e.x = e.x0 + e.r; e.dir = -1; } if (e.x < e.x0 - e.r) { e.x = e.x0 - e.r; e.dir = 1; }
    e.y = (e.t === 'bee' || e.t === 'mosq') ? e.h + Math.sin(f * 0.06 + e.ph) * 6 : e.h;
  } else {
    e.cyc = (f + e.off) % e.per; e.on = e.cyc < e.per * 0.38; e.warn = !e.on && e.cyc > e.per * 0.72;
    if (e.cyc === 0 && state === 'play') { const sx = e.x - cam; if (sx > -20 && sx < W + 20) (e.t === 'fire' ? SFX.fire : SFX.gush)(pan(sx)); }
  }
}
function hurt() {
  if (P.inv > 0 || state !== 'play') return;
  P.hearts--; hurts++; P.inv = 110; shake = 12; SFX.hurt();
  P.vy = -1.9; P.ground = false; P.on = null; P.vx = -P.face * 1.3;
  if (P.hearts <= 0) fail('hit');
}
function pitFall() {
  P.hearts--; hurts++; shake = 10; SFX.fall();
  if (P.hearts <= 0) { fail('fall'); return; }
  P.x = P.safe; P.y = 0; P.vx = 0; P.vy = 0; P.ground = true; P.on = null; P.inv = 110;

  ${lastFirst ? `<div class="souv"><span>${L.souv.e}</span><div><small>سوغاتی جدید تو کوله</small><b>${L.souv.n}</b></div></div>` : ''}
  <div class="say">${pcv('gC')}<p>«${L.guide.win}» <small>(${L.guide.name})</small></p></div>
  <div class="row">${last ? '<button class="b" id="end" data-focus>پایان سفر</button>' : `<button class="b" id="nx" data-focus>مرحله‌ی بعد: ${LEVELS[LVI + 1].fa}</button>`}
  <button class="b alt" id="rt">${r === 'S' ? 'دوباره' : 'دوباره برای رتبه‌ی S'}</button><button class="b alt" id="mp">نقشه</button></div>
  ${r !== 'S' ? '<p class="fact"><span>رتبه‌ی S:</span> حداقل ۹۰٪ آیتم‌ها و بدون هیچ ضربه‌ای.</p>' : ''}</div>`);
  portrait(q('#gC'), L.guide.O, -1);
  if (lastFirst) SFX.souv();
  const nx = q('#nx'); if (nx) nx.onclick = () => openIntro(LVI + 1);
  const en = q('#end'); if (en) en.onclick = openEnding;
  q('#rt').onclick = beginPlay; q('#mp').onclick = openMap;
}
function openFail() {
  state = 'menu';
  const t = { time: ['وقت تموم شد', 'خورشید زودتر از تو به مقصد رسید. این دفعه کمتر مکث کن.'], hit: ['جون‌هات تموم شد', 'از بالا روی عقرب‌ها و زنبورها بپر، نه از روبه‌رو بهشون بخور.'], fall: ['افتادی!', 'لب چاله‌ها بپر و دکمه‌ی پرش رو نگه دار تا بلندتر بپری.'] }[failWhy] || ['باختی', ''];
  ovShow(`<div class="res"><p class="kick">WORLD ${LV.num} · TRY AGAIN</p><h2>${t[0]}</h2><p class="stats">${t[1]}</p>
  <div class="say">${pcv('gC')}<p>«نگران نباش، یه بار دیگه امتحان کن. من همین‌جا منتظرتم.» <small>(${LV.guide.name})</small></p></div>
  <div class="row"><button class="b" id="rt" data-focus>دوباره</button><button class="b alt" id="mp">نقشه</button></div></div>`);
  portrait(q('#gC'), LV.guide.O, -1);
  q('#rt').onclick = beginPlay; q('#mp').onclick = openMap;
}
function openEnding() {
  state = 'menu';
  const ranks = LEVELS.map(L => SAVE.rank[L.id] || '-'), allS = ranks.every(r => r === 'S');
  ovShow(`<div class="res"><p class="kick">THE END · ${ranks.join(' ')}</p><h2>سفرت تموم شد، ${CH().name}!</h2>
  <p class="stats">از کنار کارون تا نخلستان‌های اروند، با مردم هر گوشه‌ی خوزستان آشنا شدی. ${allS ? 'همه‌ی مرحله‌ها رو با رتبه‌ی S تموم کردی؛ افسانه‌ای!' : 'برای رتبه‌ی S می‌تونی به هر مرحله برگردی.'}</p>
  <div class="shelf"><span class="lbl">کوله‌ی سوغاتی</span>${LEVELS.map(L => SAVE.souv[L.id] ? `<span title="${L.souv.n}">${L.souv.e}</span>` : '').join('')}</div>
  <div class="cast">${LEVELS.map((L, i) => `<div>${pcv('cast' + i)}<span>${L.guide.name}<br>${L.guide.eth.split(' · ')[0]}</span></div>`).join('')}</div>
  <div class="row"><button class="b" id="mp" data-focus>برگشت به نقشه</button></div></div>`);
  LEVELS.forEach((L, i) => portrait(q('#cast' + i), L.guide.O, 1));
  q('#mp').onclick = openMap;
}

// ================================================================ AUDIO ADDITIONS
Object.assign(SFX, {
  hurt() { if (!A.ctx) return; const t = now(); tone({ type: 'square', f0: 420, f1: 110, t, d: 0.28, v: 0.12 }); hiss({ t, freq: 800, d: 0.15, v: 0.25 }); },
  fall() { if (!A.ctx) return; const t = now(); tone({ type: 'triangle', f0: 600, f1: 80, t, d: 0.6, v: 0.12 }); SFX.splash(true); },
  stomp() { if (!A.ctx) return; const t = now(); tone({ type: 'square', f0: 180, f1: 60, t, d: 0.1, v: 0.16 }); tone({ f0: 880, t: t + 0.05, d: 0.08, v: 0.06 }); },
  boing() { tone({ type: 'triangle', f0: 120, f1: 360, d: 0.25, v: 0.2 }); },
  jump2() { tone({ f0: 440, f1: 1100, d: 0.14, v: 0.08 }); },
  fire(p) { hiss({ type: 'bandpass', freq: 500, q: 0.5, a: 0.05, d: 0.5, v: 0.18, pan: p }); },
  gush(p) { hiss({ type: 'bandpass', freq: 1200, q: 0.4, a: 0.05, d: 0.6, v: 0.14, pan: p }); },
  souv() { if (!A.ctx) return; const t = now(); [659, 784, 988, 1319].forEach((fq, i) => tone({ type: 'triangle', f0: fq, t: t + i * 0.09, d: 0.2, v: 0.08 })); },
  click() { tone({ f0: 900, d: 0.04, v: 0.05 }); }
});

// ================================================================ INPUT
function start() { initAudio(); SFX.start(); if (SAVE.char) openMap(); else openSelect(); }
function toggleMute() { A.muted = !A.muted; if (A.master) A.master.gain.setTargetAtTime(A.muted ? 0 : 0.8, now(), 0.02); }
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
addEventListener('keydown', e => {
  if (OV.classList.contains('on')) { if (e.code === 'Escape' && q('#bk,#bkMap,#mp')) q('#bk,#bkMap,#mp').click(); return; }
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter') e.preventDefault();
  if (state === 'title' && (e.code === 'Enter' || e.code === 'Space')) { start(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyR' && (state === 'play' || state === 'intro')) { beginPlay(); return; }
  if (e.code === 'Escape' && (state === 'play' || state === 'intro')) { stopMusic(); openMap(); return; }
  if (!k) return;
  if (k === 'jump' && !K.jump && !e.repeat) K.jumpPressed = true;
  K[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) K[k] = false; });
addEventListener('blur', () => { K.left = K.right = K.jump = false; });
cv.addEventListener('pointerdown', () => { cv.focus(); if (state === 'title') start(); });
document.querySelectorAll('.touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('on'); if (state === 'title') { start(); return; } if (state !== 'play' && state !== 'intro') return; if (k === 'jump' && !K.jump) K.jumpPressed = true; K[k] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('on'); K[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

// ================================================================ LOOP (fixed 60 Hz)
buildLevel(0);
let acc = 0, lastT = performance.now();
function frame(t) {
  acc += Math.min(100, t - lastT); lastT = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
</body>
